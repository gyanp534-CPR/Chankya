name: Update Doc Dates

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * *" # 11:00 PM IST
  push:
    paths:
      - "docs/**"
      - "data/pyq/tagging/rulebook.v1.2.md"
      - "scripts/update-doc-dates.ps1"
      - "scripts/ensure-docs.ps1"

jobs:
  update-doc-dates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure docs and update dates
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/ensure-docs.ps1

      - name: Commit changes (if any)
        shell: pwsh
        run: |
          git status --porcelain
          if ((git status --porcelain | Measure-Object).Count -eq 0) {
            Write-Host "No doc date changes."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/pyq/tagging/rulebook.v1.2.md
          git commit -m "chore(docs): auto-update doc dates"

      - name: Push changes
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ((git status --porcelain | Measure-Object).Count -eq 0) {
            Write-Host "Nothing to push."
            exit 0
          }
          git push
